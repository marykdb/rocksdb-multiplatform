name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            display-name: macOS Arm & Simulators
            commands: ./kotlin check macosArm64 iosSimulatorArm64 tvosSimulatorArm64 watchosSimulatorArm64
          - os: macos-latest
            display-name: Apple Device Link Checks
            commands: ./kotlin link-tests iosArm64 tvosArm64 watchosArm64 watchosDeviceArm64
          - os: macos-26-intel
            display-name: macOS Intel
            commands: ./kotlin check macosX64
          - os: ubuntu-latest
            display-name: Linux targets
            commands: ./kotlin check linuxX64 jvm
          - os: ubuntu-latest
            display-name: Linux Arm64 Link Checks
            commands: ./kotlin link-tests linuxArm64
          - os: ubuntu-latest
            display-name: Android Host & Native Link Checks
            commands: |
              ./kotlin check android
              ./kotlin link-tests androidNativeArm32 androidNativeArm64 androidNativeX64 androidNativeX86
          - os: windows-latest
            display-name: Windows targets
            commands: python scripts/kotlin_toolchain.py check mingwX64
    name: ${{ matrix.display-name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify project launcher
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run ${{ matrix.display-name }} tests
        run: ${{ matrix.commands }}
